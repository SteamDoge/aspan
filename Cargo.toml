[workspace]
members = ["crates/core", "crates/runtime"]
resolver = "2"

[workspace.package]
version = "0.0.5-rc.1"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "symbols"
