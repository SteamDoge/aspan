publish_to: none
version: 0.0.5-rc.1+9
environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.4
  path_provider: ^2.1.5
  file_selector: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
